

<div id="route-live" class="visually-hidden" role="status" aria-live="polite"></div>
<div class="theme-bar rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-3 shadow-none dark:border-white/[0.08] dark:shadow-bento-dark">
  <span class="theme-bar-label" id="theme-label">Aparência</span>
  <div class="nav-search-wrap">
    <span class="nav-search-ico" aria-hidden="true">⌕</span>
    <label class="visually-hidden" for="nav-search-input">Buscar seções e termos no material</label>
    <input type="search" id="nav-search-input" class="nav-search-input !rounded-xl !min-h-[44px]" placeholder="Buscar seção ou termo…" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="nav-search-dropdown" aria-expanded="false" role="combobox">
    <div id="nav-search-dropdown" class="nav-search-dropdown" role="listbox" aria-label="Resultados da busca" hidden></div>
  </div>
  <div class="theme-seg" role="group" aria-labelledby="theme-label">
    <button type="button" id="btn-theme-light" aria-pressed="false">Claro</button>
    <button type="button" id="btn-theme-dark" aria-pressed="true">Escuro</button>
  </div>
</div>

<div class="header">
  <div class="header-label">Material único de referência</div>
  <h1>Ecossistema de cartões <span class="h1-muted text-primary opacity-95">&amp; crédito</span></h1>
  <p>SFN · Sistema Monetário · Inflação · Câmbio · Crédito · Pagamentos · Risco · Mercado de Capitais — com trilha guiada e glossário unificado.</p>
  <span class="version rounded-full border-primary/40 px-4 py-1.5 shadow-none">v9.0.0</span>
</div>

<div class="menu-story" role="group" aria-label="Filtrar seções do menu">
  <button type="button" class="menu-chip menu-chip--all" data-filter="all" aria-pressed="true">Todos</button>
  <button type="button" class="menu-chip menu-chip--fund" data-filter="fund" aria-pressed="false">Fundamentos</button>
  <button type="button" class="menu-chip menu-chip--cred" data-filter="cred" aria-pressed="false">Crédito</button>
  <button type="button" class="menu-chip menu-chip--pay" data-filter="pay" aria-pressed="false">Pagamentos</button>

  <button type="button" class="menu-chip menu-chip--mkt" data-filter="mkt" aria-pressed="false">Mercado</button>
</div>
